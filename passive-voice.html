<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mastering Passive Voice — Year 7 English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900&family=Source+Serif+4:opsz,wght@8..60,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1208; --paper: #f5f0e8; --red: #c0392b;
    --gold: #b8860b; --grey: #6b6357; --border: #c8bfaa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Source Serif 4', Georgia, serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 20px;
    background-image: repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(0,0,0,0.04) 28px);
  }
  .box {
    max-width: 560px; width: 100%;
    border: 2px solid var(--border);
    padding: 40px;
    text-align: center;
    background: #fff;
  }
  .vol {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--grey); margin-bottom: 12px;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem; font-weight: 900; line-height: 1.1; margin-bottom: 16px;
  }
  h1 span { color: var(--red); }
  p { font-size: 0.95rem; line-height: 1.7; color: var(--grey); margin-bottom: 28px; }
  .btn {
    display: inline-block;
    background: var(--red); color: #fff;
    text-decoration: none;
    padding: 12px 30px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
    transition: background 0.2s;
    margin: 6px;
  }
  .btn:hover { background: #922b21; }
  .btn.secondary {
    background: transparent; color: var(--grey);
    border: 1px solid var(--border);
  }
  .btn.secondary:hover { background: var(--paper); }
</style>
</head>
<body>
  <div class="box">
    <div class="vol">Vol. I · Year 7 English</div>
    <h1>Mastering <span>Passive</span> Voice</h1>
